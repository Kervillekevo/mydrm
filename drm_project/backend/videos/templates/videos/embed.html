<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ video.title }}</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #video-player {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
     position: relative;
    }
  </style>
</head>
<body>

<video
  id="video-player"
  class="video-js vjs-default-skin"
  controls
  preload="auto"
></video>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@1.1.3/dist/videojs-hls-quality-selector.min.js"></script>

<script>
  const player = videojs('video-player', {
    autoplay: false,
    controls: true,
    responsive: true,
    fluid: true,
    sources: [{
      src: "{{ master_playlist_url }}",
      type: "application/x-mpegURL"
    }]
  });

  player.hlsQualitySelector && player.hlsQualitySelector({ displayCurrentQuality: true });

  // Inject token into all segment/key requests
  const token = "{{ token|escapejs }}";

  player.ready(() => {
    if (player.tech().hls) {
      const hls = player.tech().hls;
      if (hls.xhr) {
        const orig = hls.xhr.beforeRequest;
        hls.xhr.beforeRequest = function (options) {
          if (token) {
            const url = new URL(options.uri, window.location.origin);
            url.searchParams.set('token', token);
            options.uri = url.toString();
          }
          return orig ? orig(options) : options;
        };
      }
    }
      // 🔒 Disable right-click on the video element only
    const videoEl = document.getElementById('video-player');
    if (videoEl) {
      videoEl.addEventListener('contextmenu', (e) => e.preventDefault());
    }
  });
</script>

</body>
</html>
